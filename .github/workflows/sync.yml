name: War Room sync

on:
  schedule:
    - cron: '17 */6 * * *'        # every 6 hours, all week
    - cron: '*/15 17-23 * * 0'    # every 15 minutes, Sunday 1 PM to 8 PM ET (games in progress)
    - cron: '*/15 0-4 * * 1,2,5'  # every 15 minutes, Sunday/Monday/Thursday nights (UTC early morning)
  workflow_dispatch:          # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python sync.py
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          SAVE_RAW: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Save results
        if: always()
        run: |
          git config user.name "war-room-bot"
          git config user.email "war-room-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
